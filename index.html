<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#cfdde3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>북쪽 길 사진 여행</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 플레이 중 화면: 조이스틱과 메뉴 버튼만 -->
  <div id="hud" class="hidden">
    <div id="joystick"><div id="joyKnob"></div></div>
    <button id="menuBtn" aria-label="메뉴">
      <span></span><span></span><span></span>
    </button>
    <div id="hint"></div>
  </div>

  <!-- 메뉴 -->
  <div id="menu" class="hidden">
    <div class="panel">
      <h2>잠시 쉬어 가기</h2>
      <button id="resumeBtn" class="primary">계속 걷기</button>
      <button id="qualityBtn">화질: 높음</button>
      <button id="fullBtn">전체 화면</button>
      <button id="titleBtn">처음 화면으로</button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div id="title">
    <div class="title-inner">
      <p class="subtitle">노르웨이 · 이른 여름 아침</p>
      <h1>북쪽 길<br>사진 여행</h1>
      <button id="startBtn" disabled>세상을 만드는 중…</button>
      <div id="progress"><div id="progressBar"></div></div>
    </div>
  </div>

  <!-- 햇살 전환 효과 -->
  <div id="fade"></div>

  <noscript>이 게임은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
